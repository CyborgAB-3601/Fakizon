  <circle cx="200" cy="190" r="60" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <!-- Camera Lens Elements -->
  <circle cx="200" cy="190" r="40" fill="#0284c7"/>
  <circle cx="200" cy="190" r="24" fill="#0c4a6e"/>
